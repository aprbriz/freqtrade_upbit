# =============================================================================
# Upbit 실시간 OHLCV 수집기 설정 파일
# 파일명: config_upbit_exchange.yml
# 위치: user_data/upbit_exchange/config_upbit_exchange.yml
# =============================================================================

# -----------------------------------------------------------------------------
# 수집 대상 페어
# 형식: KRW-{코인심볼}
# -----------------------------------------------------------------------------
pairs:
  - KRW-BTC
  - KRW-ETH
  - KRW-XRP

# -----------------------------------------------------------------------------
# Phase 2 활성화 여부
# true: mid/long collector 추가 실행 (별도 WebSocket + DB)
# false: short collector만 실행
# -----------------------------------------------------------------------------
phase2_enabled: true

# -----------------------------------------------------------------------------
# 합성 봉 활성화 여부 (메모리 전용, DB 저장 안 함)
# true: 1초봉 기반 5초/10초/33초/57초/1분봉 합성
# false: 합성 봉 비활성화
# -----------------------------------------------------------------------------
derived_timeframes_enabled: true

# -----------------------------------------------------------------------------
# 타임프레임 설정 (밀리초 단위)
# -----------------------------------------------------------------------------

# short collector: 초단기 봉 (ohlcv_short.sqlite)
short_timeframes_ms:
  - 500    # 0.5초봉
  - 1000   # 1초봉

# mid collector: 중기 봉 (ohlcv_10s_1m.sqlite)
mid_timeframes_ms:
  - 10000  # 10초봉
  - 60000  # 1분봉

# long collector: 장기 봉 (ohlcv_10m.sqlite)
long_timeframes_ms:
  - 600000 # 10분봉

# 합성 봉 타임프레임 (메모리 전용)
# 1초봉 데이터를 기반으로 메모리에서 합성
derived_timeframes_ms:
  - 5000   # 5초봉
  - 10000  # 10초봉
  - 33000  # 33초봉
  - 57000  # 57초봉
  - 60000  # 1분봉

# -----------------------------------------------------------------------------
# 성능 및 운영 설정
# -----------------------------------------------------------------------------

# flush 지연 허용 시간 (밀리초)
# 이 시간이 지난 봉만 DB에 저장
max_late_ms: 2000

# 통계 로그 출력 주기 (초)
stats_interval: 30.0

# -----------------------------------------------------------------------------
# HTTP 헬스체크 서버 설정
# -----------------------------------------------------------------------------

# HTTP 서버 활성화 여부
http_enabled: true

# HTTP 서버 포트
# 헬스체크: http://localhost:8000/health
# 통계: http://localhost:8000/stats
http_port: 8000

# -----------------------------------------------------------------------------
# 재연결 정책 (고급 설정, 일반적으로 수정 불필요)
# -----------------------------------------------------------------------------

# 주기적 재연결 주기 (초)
# 업비트 서버 장기 연결 종료 방지 (DEC-009)
# periodic_reconnect_seconds: 32400  # 9시간

# 재연결 기본 대기 시간 (초)
# reconnect_base_delay: 1.0

# 재연결 최대 대기 시간 (초)
# reconnect_max_delay: 60.0

# -----------------------------------------------------------------------------
# DB 설정 (고급 설정)
# -----------------------------------------------------------------------------

# 배치 커밋 크기 (건수)
# batch_size: 100

# 오래된 데이터 자동 삭제 (일)
# cleanup_days: 365