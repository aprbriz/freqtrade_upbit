<!DOCTYPE html>

<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif; background:#FFFFFF; color:#1A1D24; }

.header { height:48px; background:#F6F7F9; border-bottom:1px solid #E2E4E9; display:flex; align-items:center; padding:0 16px; gap:10px; }
.header .logo { height:22px; }
.header .label { font-size:14px; font-weight:600; color:#3D4350; }
.chip { display:inline-flex; align-items:center; padding:0 9px; height:22px; border-radius:11px; font-size:11px; font-weight:600; white-space:nowrap; }
.chip-ok { background:rgba(13,159,97,0.08); color:#0D9F61; }
.chip-warn { background:rgba(217,119,6,0.07); color:#D97706; }
.spacer { flex:1; }
.theme-label { font-size:10px; color:#9CA3AF; margin-right:4px; }
.theme-btn { width:28px; height:28px; border-radius:6px; border:1px solid #E2E4E9; background:#FFFFFF; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#6B7280; }
.alert-text { font-size:11px; font-weight:500; color:#D97706; background:rgba(217,119,6,0.07); border:1px solid rgba(217,119,6,0.14); border-radius:6px; padding:2px 10px; height:24px; display:flex; align-items:center; }

.main { display:flex; height:calc(1080px - 48px - 28px); }
.chart-pane { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.chart-pane + .chart-pane { border-left:1px solid #E2E4E9; }

.chart-header { padding:12px 16px 8px 16px; }
.chart-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.symbol-name { font-size:13px; font-weight:600; color:#3D4350; }
.tf-select { font-size:11px; padding:3px 8px; border:1px solid #E2E4E9; border-radius:4px; background:#F6F7F9; color:#3D4350; appearance:auto; }
.price-row { display:flex; align-items:baseline; gap:10px; }
.price { font-size:32px; font-weight:700; line-height:1.2; }
.price-up { color:#E54040; }
.price-down { color:#3182F6; }
.change { font-size:13px; font-weight:500; }

.candle-area { flex:1; min-height:280px; position:relative; }
.candle-area svg { width:100%; height:100%; }
.volume-area { height:92px; border-top:1px solid #F0F1F4; position:relative; }
.volume-area svg { width:100%; height:100%; }

.footer { height:28px; background:#F6F7F9; border-top:1px solid #E2E4E9; display:flex; align-items:center; padding:0 16px; }
.footer span { font-size:11px; color:#6B7280; }

.grid-line { stroke:#F0F1F4; stroke-width:1; }
.axis-label { font-size:9px; fill:#9CA3AF; }
</style>

<script>
// Seeded PRNG (mulberry32)
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

function generateCandles(seed, basePrice, volatilityPct, count){
  var rng=mulberry32(seed);
  var candles=[];var price=basePrice;
  for(var i=0;i<count;i++){
    var change=(rng()-0.48)*basePrice*volatilityPct;
    var o=price,c=price+change;
    var h=Math.max(o,c)+rng()*Math.abs(change)*0.5;
    var l=Math.min(o,c)-rng()*Math.abs(change)*0.5;
    var v=rng()*0.8+0.2;
    candles.push({o:o,h:h,l:l,c:c,v:v});
    price=c;
  }
  return candles;
}

function drawCandles(svgId, candles, rightMargin){
  var svg=document.getElementById(svgId);
  var W=svg.clientWidth, H=svg.clientHeight;
  var rm=rightMargin||52, bm=18;
  var pw=W-rm, ph=H-bm;
  var allH=candles.map(c=>c.h), allL=candles.map(c=>c.l);
  var minP=Math.min(...allL)*0.999, maxP=Math.max(...allH)*1.001;
  var pRange=maxP-minP||1;
  var barW=pw/candles.length, bodyW=barW*0.7;
  var html='';
  // Grid
  for(var g=0;g<5;g++){
    var gy=ph*g/4;
    html+='<line x1="0" y1="'+gy+'" x2="'+pw+'" y2="'+gy+'" class="grid-line"/>';
    var pv=maxP-(maxP-minP)*g/4;
    html+='<text x="'+(pw+4)+'" y="'+(gy+3)+'" class="axis-label">'+formatPrice(pv)+'</text>';
  }
  // X-axis labels
  for(var xi=0;xi<5;xi++){
    var idx=Math.floor(xi*candles.length/5);
    var xp=idx*barW+bodyW/2;
    var hr=8+xi*3, mn=xi*12;
    html+='<text x="'+xp+'" y="'+(ph+14)+'" class="axis-label" text-anchor="middle">'+pad(hr)+':'+pad(mn)+'</text>';
  }
  // Candles
  for(var i=0;i<candles.length;i++){
    var c=candles[i], x=i*barW, up=c.c>=c.o;
    var color=up?'#E54040':'#3182F6';
    var wx=x+bodyW/2;
    var yh=(1-(c.h-minP)/pRange)*ph;
    var yl=(1-(c.l-minP)/pRange)*ph;
    var yo=(1-(c.o-minP)/pRange)*ph;
    var yc=(1-(c.c-minP)/pRange)*ph;
    var bt=Math.min(yo,yc), bh=Math.max(Math.abs(yc-yo),1);
    html+='<line x1="'+wx.toFixed(1)+'" y1="'+yh.toFixed(1)+'" x2="'+wx.toFixed(1)+'" y2="'+yl.toFixed(1)+'" stroke="'+color+'" stroke-width="1"/>';
    html+='<rect x="'+x.toFixed(1)+'" y="'+bt.toFixed(1)+'" width="'+bodyW.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+color+'"/>';
  }
  svg.innerHTML=html;
}

function drawVolume(svgId, candles, rightMargin){
  var svg=document.getElementById(svgId);
  var W=svg.clientWidth, H=svg.clientHeight;
  var rm=rightMargin||52, pw=W-rm, ph=H-4;
  var barW=pw/candles.length, bodyW=barW*0.7;
  var maxV=Math.max(...candles.map(c=>c.v));
  var html='';
  for(var g=0;g<3;g++){
    var gy=ph*g/2;
    html+='<line x1="0" y1="'+gy+'" x2="'+pw+'" y2="'+gy+'" class="grid-line"/>';
  }
  for(var i=0;i<candles.length;i++){
    var c=candles[i], x=i*barW, up=c.c>=c.o;
    var color=up?'#E54040':'#3182F6';
    var bh=(c.v/maxV)*ph;
    html+='<rect x="'+x.toFixed(1)+'" y="'+(ph-bh).toFixed(1)+'" width="'+bodyW.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+color+'" opacity="0.6"/>';
  }
  svg.innerHTML=html;
}

function formatPrice(p){
  if(p>=1000000) return (p/1000000).toFixed(1)+'M';
  if(p>=1000) return (p/1000).toFixed(1)+'K';
  return p.toFixed(0);
}
function pad(n){return n<10?'0'+n:''+n;}

var btcCandles=generateCandles(42, 134000000, 0.008, 60);
var ethCandles=generateCandles(77, 5020000, 0.01, 60);

drawCandles('btc-candle', btcCandles);
drawVolume('btc-vol', btcCandles);
drawCandles('eth-candle', ethCandles);
drawVolume('eth-vol', ethCandles);
</script>
