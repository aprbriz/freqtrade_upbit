방안 1️⃣: Docker 유지 + ‘개발용 이미지’ 전략을 선택할께

그런데.. 어제 빡쌔가 작업한 것이 좀 아쉽지만..
freqtrade 최신버전 (2025.12) 의 소스로 다시 돌려놓아야겠어.
근데.. 이 버전의 docker 이미지는 PYTHON 3.13 인인것 같아.
(네가 python 3.12 버전으로 작업을 추천한 이유는?)

그리고 아래는 내 docker-compose.yml 파일인데 보면..
git-hub 에 소스도 올렸고 CI/CD 도 설정해 놓았음.

[main 요청] 뭐부터 하면되? 첫단계부터 초보자같은 나에게 설명해줘.

아.. 그리고 freqtrade-upbit 가 아니라 freqtrade_upbit 임 ^^;

=======================
---
services:
  freqtrade:
    image: ghcr.io/aprbriz/freqtrade_upbit:latest
    # image: freqtradeorg/freqtrade:develop
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade_upbit
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./1bil:/freqtrade/1bil
      - ./1bil_tests:/freqtrade/tests  # 로컬 소스를 컨테이너 내부로 연결
      - ./1bil_exchange:/freqtrade/freqtrade/exchange  # 로컬 소스를 컨테이너 내부로 연

    # Expose api on port 8080 (localhost only)
    # Please read the https://www.freqtrade.io/en/stable/rest-api/ documentation
    # for more information.
    ports:
      - "8080:8080"
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy SampleStrategy
